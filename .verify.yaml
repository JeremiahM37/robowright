# verify run  (from the repo root)
backend: web

options:
  web:
    headless: true
    viewport: [1400, 900]

steps:
  - name: lint
    actions:
      - shell: ".venv/bin/ruff check . && .venv/bin/ruff format --check ."

  - name: tests on both physics engines (SO-101)
    actions:
      - shell: { cmd: "capped .venv/bin/python -m pytest tests examples -q -n 4 -p no:cacheprovider --rw-backend mujoco,pybullet", timeout: 900 }

  - name: every robot on both engines (arm contract, legged contract, examples; known divergences are strict xfails)
    actions:
      - shell: { cmd: "capped .venv/bin/python -m pytest tests/test_conformance.py tests/test_legged.py examples -q -n 4 -p no:cacheprovider --rw-backend mujoco,pybullet --rw-robot all,legged", timeout: 1800 }

  - name: every robot on Drake and Genesis (conformance + legged)
    actions:
      - shell: { cmd: "capped .venv/bin/python -m pytest tests/test_conformance.py tests/test_legged.py -q -n 4 -p no:cacheprovider --rw-backend drake --rw-robot all,legged && capped .venv/bin/python -m pytest tests/test_conformance.py tests/test_legged.py -q -n 2 -p no:cacheprovider --rw-backend genesis --rw-robot all,legged", timeout: 2400 }

  - name: cli reports working offscreen rendering
    actions:
      - shell: ".venv/bin/robowright info 2>&1 | grep -q 'offscreen rendering: ok'"

  - name: failing run produces a trace that replays bit-identically
    actions:
      - shell: ".venv/bin/python scripts/verify_viewer.py /tmp/robowright-verify && .venv/bin/robowright replay /tmp/robowright-verify/verify__test_place_in_wrong_spot.zip | grep -q bit-identical"

  - name: generated regression test reproduces the failure
    actions:
      - shell: "cd /tmp/robowright-verify && $OLDPWD/.venv/bin/robowright codegen verify__test_place_in_wrong_spot.zip -o test_regression.py && ! $OLDPWD/.venv/bin/python -m pytest -q -p no:cacheprovider test_regression.py"

  - name: trace viewer DOM (desktop + Pixel 7)
    actions:
      - shell: "/home/admin/.venvs/verify/bin/python scripts/check_viewer.py /tmp/robowright-verify/trace.html"

  - name: trace viewer renders
    actions:
      - navigate: "file:///tmp/robowright-verify/trace.html"
      - wait: 1
    expect:
      vision: "a trace viewer: an action list on the left with a red failed 'expect(cube).to_be_inside' entry, a 3D render of a yellow robot arm with a red cube and blue bin in the middle, timeline and line plots below; no error message and not blank"
