# verify run  (from the repo root)
backend: web

options:
  web:
    headless: true
    viewport: [1400, 900]

steps:
  - name: lint
    actions:
      - shell: ".venv/bin/ruff check . && .venv/bin/ruff format --check ."

  # What GitHub's unit job has installed: no Drake, Genesis, gymnasium or ROS. A test that imports an
  # optional engine before its skip guard breaks collection there and nowhere else.
  - name: every test file is collected with only the base and PyBullet extras installed (as in CI)
    actions:
      - shell: { cmd: "V=$HOME/.cache/robowright/ci-venv; [ -x $V/bin/python ] || uv venv -q --python 3.12 $V; uv pip install -q --python $V/bin/python -e '.[dev,pybullet]' && $V/bin/python -m pytest tests examples --collect-only -q -p no:cacheprovider | tail -1", timeout: 600 }

  # The robot contract and the examples run for every robot (SO-101 included) in the next step.
  - name: tests on both physics engines (SO-101)
    actions:
      - shell: { cmd: "capped .venv/bin/python -m pytest tests -q -n auto --dist loadgroup -p no:cacheprovider --ignore=tests/test_conformance.py --ignore=tests/test_legged.py --rw-backend mujoco,pybullet", timeout: 900 }

  - name: every robot on both engines (arm contract, legged contract, examples; known divergences are strict xfails)
    actions:
      - shell: { cmd: "capped .venv/bin/python -m pytest tests/test_conformance.py tests/test_legged.py examples -q -n auto --dist loadgroup -p no:cacheprovider --rw-backend mujoco,pybullet --rw-robot all,legged", timeout: 1800 }

  - name: every robot on Drake and Genesis (conformance + legged)
    actions:
      - shell: { cmd: "capped .venv/bin/python -m pytest tests/test_conformance.py tests/test_legged.py -q -n auto --dist loadgroup -p no:cacheprovider --rw-backend drake --rw-robot all,legged && capped .venv/bin/python -m pytest tests/test_conformance.py tests/test_legged.py -q -n auto --dist loadgroup -p no:cacheprovider --rw-backend genesis --rw-robot all,legged", timeout: 2400 }

  - name: ROS 2 both ways (robowright drives ros2_control and Gazebo; a separate ROS 2 stack drives robowright's simulation)
    actions:
      - shell: { cmd: "capped scripts/ros2_env.sh pytest tests/test_ros2.py tests/test_ros2_bridge.py tests/test_gazebo.py -q -n 4 -p no:cacheprovider", timeout: 1200 }

  - name: someone else's whole stack (UR's Gazebo simulation and MoveIt, MoveIt's Panda demo, Kinova's and UFACTORY's Gazebo simulations), observed and driven through its own controllers
    actions:
      - shell: { cmd: "capped scripts/ros2_env.sh pytest tests/test_moveit_gazebo.py tests/test_moveit_panda.py tests/test_kinova_gazebo.py tests/test_xarm_gazebo.py -q -p no:cacheprovider", timeout: 1800 }

  - name: Nav2's own TurtleBot simulations and example programs, robowright observing a mobile robot (truth from Gazebo, belief from TF)
    actions:
      - shell: { cmd: "ROBOWRIGHT_ROS2_ENV=$HOME/.cache/robowright/ros2-jazzy-nav2 capped scripts/ros2_env.sh pytest tests/test_nav2_examples.py tests/test_nav2_turtlebot.py -q -p no:cacheprovider", timeout: 1500 }

  - name: fidelity - the default is the model as published, and every change is on record
    actions:
      - shell: ".venv/bin/robowright fidelity --robot panda --backend mujoco | grep -q 'sourced: grip force' && ! .venv/bin/robowright fidelity --robot panda | grep -q '^  adjusted'"

  - name: cli reports working offscreen rendering
    actions:
      - shell: ".venv/bin/robowright info 2>&1 | grep -q 'offscreen rendering: ok'"

  - name: failing run produces a trace that replays bit-identically
    actions:
      - shell: ".venv/bin/python scripts/verify_viewer.py /tmp/robowright-verify && .venv/bin/robowright replay /tmp/robowright-verify/verify__test_place_in_wrong_spot.zip | grep -q bit-identical"

  - name: generated regression test reproduces the failure
    actions:
      - shell: "cd /tmp/robowright-verify && $OLDPWD/.venv/bin/robowright codegen verify__test_place_in_wrong_spot.zip -o test_regression.py && ! $OLDPWD/.venv/bin/python -m pytest -q -p no:cacheprovider test_regression.py"

  - name: an MCP client drives a robot and the test it saves passes
    actions:
      - shell: "capped .venv/bin/python scripts/mcp_smoke.py /tmp/robowright-verify/mcp"

  - name: trace viewer DOM (desktop + Pixel 7)
    actions:
      - shell: "${VERIFY_PYTHON:-python3} scripts/check_viewer.py /tmp/robowright-verify/trace.html"

  - name: live view serves a running simulation
    actions:
      - shell: "(timeout 120 .venv/bin/robowright sim --robot panda --live 8799 > /tmp/robowright-verify/sim.log 2>&1 &) ; sleep 8 ; curl -sf http://127.0.0.1:8799/state | grep -q panda"
      - navigate: "http://127.0.0.1:8799/"
      - wait: 2
    expect:
      vision: "a 'robowright live' page: a camera view of a white Franka Panda robot arm above a checkered floor with a red cube and a blue bin, and beside it tables of joint values and object positions; not blank, no error"

  - name: trace viewer renders
    actions:
      - navigate: "file:///tmp/robowright-verify/trace.html"
      - wait: 1
    expect:
      vision: "a trace viewer: an action list on the left with a red failed 'expect(cube).to_be_inside' entry, a 3D render of a yellow robot arm with a red cube and blue bin in the middle, timeline and line plots below; no error message and not blank"
