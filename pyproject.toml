[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "robowright"
version = "0.1.0.dev0"
description = "Playwright-style testing for robots: one test, 19 robots, five physics engines. Auto-waiting actions, expect() assertions, traces, replay and codegen."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "src/robowright/assets/so101/LICENSE-so101"]
requires-python = ">=3.10"
authors = [{ name = "Jeremiah Mackey" }]
keywords = ["robotics", "testing", "pytest", "mujoco", "pybullet", "genesis", "drake", "simulation", "lerobot", "franka", "ur5e", "unitree"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mujoco>=3.2",
    "numpy>=1.24",
    "pillow>=9",
    "pytest>=7",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
pybullet = ["pybullet>=3.2.6"]
genesis = ["genesis-world>=1.4", "torch>=2.4"]
drake = ["drake>=1.30; python_version >= '3.12'", "scipy>=1.10"]
video = ["imageio>=2.31", "imageio-ffmpeg>=0.4"]
mcp = ["mcp>=1.2"]
# Learned policies exported to ONNX (robowright.learned); PyTorch models need only torch.
onnx = ["onnxruntime>=1.17"]
# Reading URDFs: COLLADA meshes (trimesh, pycollada), splitting concave jaws (coacd), xacro templates.
urdf = ["trimesh>=4", "scipy>=1.10", "pycollada>=0.8", "coacd>=1.0", "xacro>=2"]
# No PyBullet here: it has wheels only up to Python 3.11, and later Pythons build it from source
# (a C++ compiler and the Python headers). Add it with ".[dev,pybullet]"; its tests skip without it.
dev = ["pytest-xdist>=3", "ruff>=0.5", "imageio>=2.31", "imageio-ffmpeg>=0.4", "mcp>=1.2", "trimesh>=4", "scipy>=1.10", "pycollada>=0.8", "xacro>=2", "onnxruntime>=1.17"]

[project.scripts]
robowright = "robowright.cli:main"

[project.entry-points.pytest11]
robowright = "robowright.pytest_plugin"

[project.urls]
Homepage = "https://github.com/JeremiahM37/robowright"

[tool.hatch.build.targets.wheel]
packages = ["src/robowright"]

[tool.hatch.build.targets.sdist]
exclude = ["/robowright-traces", "/bench/results/*.zip", "/.venv"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B027", "B028", "B905", "E731"]
