name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MUJOCO_GL: egl

jobs:
  unit:
    # The framework itself, on the default robot (SO-101 ships with robowright, no download).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Offscreen GL (Mesa EGL)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgles2 libosmesa6
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - run: robowright info
      - name: Tests (MuJoCo + PyBullet, SO-101)
        run: pytest tests examples -n auto --rw-backend mujoco,pybullet --rw-robot so101
      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-unit-py${{ matrix.python }}
          path: robowright-traces/

  matrix:
    # Every robot on every engine CI can run (Isaac Sim needs an NVIDIA GPU machine): the backend
    # contract and the legged contract. The statistical examples on every robot (20-trial runs) are
    # too heavy for hosted runners; verify runs them locally. Known divergences are strict xfails.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [mujoco, pybullet, drake, genesis]
        robots: [all, legged]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgles2 libosmesa6
      - run: pip install -e ".[dev]"
      - if: matrix.backend == 'drake'
        run: pip install -e ".[drake]"
      - if: matrix.backend == 'genesis'
        # CPU torch: Genesis runs on its CPU backend by default.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -e ".[genesis]"
      - name: Robot models (MuJoCo Menagerie, sparse checkout) and exported URDFs
        uses: actions/cache@v4
        with:
          path: ~/.cache/robowright
          key: robowright-models-${{ hashFiles('src/robowright/robots/**') }}
      - name: Robot x engine tests
        # A Genesis worker takes ~4.5 GB; hosted runners have 7 GB, so Genesis runs in one process.
        # Tracing off: recording camera frames through software rendering on two cores costs more
        # than the physics; the unit job covers traces.
        run: pytest tests/test_conformance.py tests/test_legged.py -n ${{ matrix.backend == 'genesis' && '0' || 'auto' }} --rw-backend ${{ matrix.backend }} --rw-robot ${{ matrix.robots }} --rw-trace off
