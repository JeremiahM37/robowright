name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MUJOCO_GL: egl

jobs:
  unit:
    # The framework itself, on the default robot (SO-101 ships with robowright, no download).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Offscreen GL (Mesa EGL)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgles2 libosmesa6
      - run: pip install -e ".[dev,pybullet]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - run: robowright info
      - name: Tests (MuJoCo + PyBullet, SO-101)
        run: pytest tests examples -n auto --rw-backend mujoco,pybullet --rw-robot so101
      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-unit-py${{ matrix.python }}
          path: robowright-traces/

  docs:
    # The documentation site, strictly: a README section a page takes that is gone, a broken link or anchor, or an
    # API page whose object moved fails the build. (The CLI reference runs the commands' own --help, so it installs.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # importing robowright imports mujoco, which loads EGL (MUJOCO_GL above)
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgles2 libosmesa6
      - run: pip install -e ".[docs]"
      - run: pytest tests/test_docs_pages.py -p no:cacheprovider
      - run: mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/

  vscode:
    # The VS Code extension (editors/vscode) inside a real VS Code, on a small project of robot tests: found, run,
    # each outcome reported, a test stopped at a breakpoint under the Python Debugger, and a failure's trace opened.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgles2 libosmesa6 xvfb
      - run: pip install -e .
      - run: npm ci
        working-directory: editors/vscode
      - run: xvfb-run -a npm test
        working-directory: editors/vscode
        env:
          ROBOWRIGHT_PYTHON: python

  init-workflow:
    # The CI workflow robowright init gives every new project, run step by step as GitHub runs it (both shards, then
    # the merged report), with this commit installed in place of the published robowright.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyyaml
      # A newcomer's machine: no MUJOCO_GL (set for the other jobs above), no EGL installed until the workflow does it.
      - run: unset MUJOCO_GL && robowright init /tmp/proj
      - run: unset MUJOCO_GL && python scripts/run_init_workflow.py /tmp/proj "$PWD"

  docker:
    # The Dockerfile's image, built and used as a newcomer would: a project made by robowright init, its tests run
    # inside the container, rendering on the CPU. Built only; nothing is published.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t robowright .
      - run: |
          docker run --rm robowright robowright info | tee info.txt
          grep -q "offscreen rendering: ok" info.txt
      - run: |
          mkdir proj
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD/proj":/work robowright robowright init .
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD/proj":/work robowright pytest -q -p no:cacheprovider

  matrix:
    # Every robot on every engine CI can run (Isaac Sim needs an NVIDIA GPU machine): the backend
    # contract and the legged contract. The statistical examples on every robot (20-trial runs) are
    # too heavy for hosted runners; verify runs them locally. Known divergences are strict xfails.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [mujoco, pybullet, drake, genesis]
        robots: [all, legged]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgles2 libosmesa6
      - run: pip install -e ".[dev,pybullet]"
      - if: matrix.backend == 'drake'
        run: pip install -e ".[drake]"
      - if: matrix.backend == 'genesis'
        # CPU torch: Genesis runs on its CPU backend by default.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -e ".[genesis]"
      - name: Robot models (MuJoCo Menagerie, sparse checkout) and exported URDFs
        uses: actions/cache@v4
        with:
          path: ~/.cache/robowright
          key: robowright-models-${{ hashFiles('src/robowright/robots/**') }}
      - name: Robot x engine tests
        # Genesis (~4.5 GB per worker) and Drake (several worlds per process in the determinism test)
        # outgrow a 7 GB hosted runner with two workers, so they run in one process.
        # Tracing off: recording camera frames through software rendering on two cores costs more
        # than the physics; the unit job covers traces.
        run: pytest tests/test_conformance.py tests/test_legged.py -n ${{ contains(fromJSON('["genesis", "drake"]'), matrix.backend) && '0' || 'auto' }} --rw-backend ${{ matrix.backend }} --rw-robot ${{ matrix.robots }} --rw-trace off
      - name: Detection re-derives every downloaded robot's entry from its model file
        if: matrix.backend == 'mujoco'
        run: pytest tests/test_detect.py -n auto
